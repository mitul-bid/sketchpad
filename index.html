const num=(d,id)=>parseFloat(d.querySelector('#'+id).value)||0;
function flipRotateDlg(){dialog('Flip and Rotate',`<fieldset><label><input type="radio" name="fr" value="h" checked> Flip horizontal</label><label><input type="radio" name="fr" value="v"> Flip vertical</label><label><input type="radio" name="fr" value="r"> Rotate by angle</label><div style="margin-left:22px"><label><input type="radio" name="ang" value="90" checked> 90&deg;</label><label><input type="radio" name="ang" value="180"> 180&deg;</label><label><input type="radio" name="ang" value="270"> 270&deg;</label></div></fieldset>`,d=>{const m=d.querySelector('[name=fr]:checked').value,a=+d.querySelector('[name=ang]:checked').value;imageOp(m==='h'?flipH:m==='v'?flipV:s=>rotate(s,a))})}
function stretchSkewDlg(){dialog('Stretch and Skew',`<fieldset><legend>Stretch</legend><label>Horizontal: <input type="number" id="ss-h" value="100" min="1" max="500"> %</label><label>Vertical: <input type="number" id="ss-v" value="100" min="1" max="500"> %</label></fieldset><fieldset><legend>Skew</legend><label>Horizontal: <input type="number" id="sk-h" value="0" min="-89" max="89"> degrees</label><label>Vertical: <input type="number" id="sk-v" value="0" min="-89" max="89"> degrees</label></fieldset>`,d=>{const sx=clamp(num(d,'ss-h'),1,500),sy=clamp(num(d,'ss-v'),1,500),kx=clamp(num(d,'sk-h'),-89,89),ky=clamp(num(d,'sk-v'),-89,89);if(sx===100&&sy===100&&!kx&&!ky)return;imageOp(s=>stretchSkew(s,sx,sy,kx,ky))})}

function zoomDlg(){dialog('Custom Zoom',`<div>Current zoom: ${S.zoom*100}%</div><fieldset><legend>Zoom to</legend>${[1,2,4,6,8,12,16].map(z=>`<label><input type="radio" name="zz" value="${z}"${z===S.zoom?' checked':''}> ${z*100}%</label>`).join('')}</fieldset>`,d=>{const c=d.querySelector('[name=zz]:checked');if(c)setZoom(+c.value)})}
function aboutDlg(){dialog('About Sketchpad','<div style="display:flex;gap:12px;align-items:center"><div style="width:40px;height:40px">'+ICONS.brush+'</div><div><b>Sketchpad</b> 1.0<br>A classic-style bitmap editor.<br>Original code and artwork.<br><span style="color:#555">Single-file build, works offline.</span></div></div>',()=>{},null,{noCancel:true})}
let custom=[];try{custom=JSON.parse(localStorage.getItem('sketchpad.custom')||'[]')}catch(_){}while(custom.length<16)custom.push('#ffffff');
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return rgb2hex(Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4)))}
const BASIC=[];[85,70,50,38,25,14].forEach((l,r)=>{for(let c=0;c<8;c++)BASIC.push(c===7?hsl(0,0,[100,75,55,35,18,0][r]):hsl(c*45+(l<40?15:0),l===85?100:80,l))});
function editColors(){let cur=S.fg,slot=0;const body=`<div class="ec"><div><div>Basic colors:</div><div class="g8" id="ec-basic">${BASIC.map(c=>`<div style="background:${c}" data-c="${c}"></div>`).join('')}</div><div>Custom colors:</div><div class="g8" id="ec-cust"></div></div><div><div>Color:</div><input type="color" id="ec-pick" style="width:70px;height:28px"><div id="ecprev"></div><label>Red: <input type="number" id="ec-r" min="0" max="255"></label><label>Green: <input type="number" id="ec-g" min="0" max="255"></label><label>Blue: <input type="number" id="ec-b" min="0" max="255"></label><label>Hex: <input type="text" id="ec-hex" size="8"></label><button id="ec-add" type="button" style="margin-top:6px">Add to Custom Colors</button></div></div>`;

  q('#ec-basic').onclick=e=>{if(e.target.dataset.c)upd(e.target.dataset.c)};q('#ec-cust').onclick=e=>{if(e.target.dataset.s!=null){slot=+e.target.dataset.s;upd(e.target.dataset.c);rc()}};q('#ec-pick').oninput=e=>upd(e.target.value,'pick');['#ec-r','#ec-g','#ec-b'].forEach(s=>q(s).oninput=()=>upd(rgb2hex(+q('#ec-r').value,+q('#ec-g').value,+q('#ec-b').value),'rgb'));q('#ec-hex').oninput=e=>{const v=e.target.value.trim();if(/^#?[0-9a-f]{6}$/i.test(v))upd(('#'+v.replace('#','')).toLowerCase(),'hex')};q('#ec-add').onclick=()=>{custom[slot]=cur;slot=(slot+1)%16;rc()}})}

/* ---------- floating panels ---------- */
function makeDraggable(el){const h=el.querySelector('.fhead');h.addEventListener('pointerdown',e=>{if(e.target.dataset.close!=null)return;e.preventDefault();const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;h.setPointerCapture(e.pointerId);const mv=ev=>{el.style.left=clamp(ev.clientX-dx,0,innerWidth-40)+'px';el.style.top=clamp(ev.clientY-dy,0,innerHeight-20)+'px';el.style.right='auto'};const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)})}
makeDraggable($('fontbar'));makeDraggable($('thumbwin'));
$('thumbwin').querySelector('[data-close]').onclick=()=>cmd('toggleThumb');
$('fontbar').querySelector('[data-close]').onclick=()=>document.body.classList.remove('texttool');
const FONTS=['Helvetica','Arial','Times New Roman','Georgia','Courier New','Verdana','Trebuchet MS','Palatino','Gill Sans','Menlo','Impact','Comic Sans MS','sans-serif','serif','monospace'];
$('ffam').innerHTML=FONTS.map(f=>`<option>${f}</option>`).join('');$('fsize').innerHTML=[8,9,10,11,12,14,16,18,20,24,28,32,36,48,60,72].map(s=>`<option${s===14?' selected':''}>${s}</option>`).join('');
$('ffam').onchange=e=>{S.font.family=e.target.value;positionText();refocusText()};$('fsize').onchange=e=>{S.font.size=+e.target.value;positionText();refocusText()};
for(const[id,k]of[['fb','b'],['fi','i'],['fu','u']]){$(id).addEventListener('pointerdown',e=>e.preventDefault());$(id).onclick=()=>{S.font[k]=!S.font[k];$(id).classList.toggle('on',S.font[k]);positionText();refocusText()}}
function refocusText(){if(txt)tbox.focus()}

/* ---------- commands & menus ---------- */
function isEditable(el){return!!el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!/^(color|radio|checkbox|button|file)$/.test(el.type))||el.isContentEditable)}
function syncMenu(){document.body.classList.toggle('notools',!S.toolbox);document.body.classList.toggle('nocolors',!S.colorbox);document.body.classList.toggle('nostatus',!S.status);$('thumbwin').style.display=S.thumb?'block':'none';if(NATIVE&&NATIVE.menuState)NATIVE.menuState({toggleToolbox:S.toolbox,toggleColorbox:S.colorbox,toggleStatus:S.status,toggleGrid:S.grid,toggleThumb:S.thumb,toggleOpaque:!S.transparent});requestAnimationFrame(layoutOverlay)}
function printCmd(){finishActive();$('printimg').src=doc.toDataURL('image/png');setTimeout(()=>window.print(),50)}
const CMDS={new:newCmd,open:openCmd,save:saveCmd,saveAs:()=>saveAsCmd(),'saveAs:png':()=>saveAsCmd('png'),'saveAs:bmp':()=>saveAsCmd('bmp'),'saveAs:jpg':()=>saveAsCmd('jpg'),print:printCmd,
 exit:()=>{if(!okDiscard())return;S.dirty=false;if(NATIVE)NATIVE.quit();else{window.close();setTimeout(()=>alert('Close this browser tab to exit Sketchpad.'),100)}},
 undo,redo,cut:()=>copyCmd(true),copy:()=>copyCmd(false),paste:pasteCmd,clearSel:()=>{if(!txt)deleteSel()},
 selectAll:()=>{finishActive();setTool('select');sel={x:0,y:0,w:S.W,h:S.H,path:null,lifted:false};setSizeStatus(`${S.W}\u00d7${S.H}`);drawOverlay()},
 toggleToolbox:()=>{S.toolbox=!S.toolbox;syncMenu()},toggleColorbox:()=>{S.colorbox=!S.colorbox;syncMenu()},toggleStatus:()=>{S.status=!S.status;syncMenu()},
 zoomNormal:()=>setZoom(1),zoomLarge:()=>setZoom(4),zoomCustom:zoomDlg,zoomIn:()=>setZoom(nextZoom(1)),zoomOut:()=>setZoom(nextZoom(-1)),
 toggleGrid:()=>{S.grid=!S.grid;if(S.grid&&S.zoom<4)setZoom(4);syncMenu();drawOverlay()},toggleThumb:()=>{S.thumb=!S.thumb;syncMenu();schedThumb()},
 flipRotate:flipRotateDlg,stretchSkew:stretchSkewDlg,invert:()=>imageOp(invert),attributes:attributesDlg,
 crop:()=>{if(!sel)return;if(txt)commitText();const c=cloneCanvas(sel.lifted?selDisplay():extract());pushUndo();sel=null;setDoc(c,c.width,c.height);setSizeStatus('')},
 clearImage:()=>{finishActive();pushUndo();dctx.fillStyle=S.bg;dctx.fillRect(0,0,S.W,S.H);schedThumb()},
 toggleOpaque:()=>{S.transparent=!S.transparent;positionText();renderFloat();renderOpts();syncMenu()},editColors,about:aboutDlg};
const EDIT_NATIVE={undo:'undo',redo:'redo',cut:'cut',copy:'copy',paste:'paste',selectAll:'selectAll',clearSel:'delete'};
function cmd(id){const ae=document.activeElement;if(isEditable(ae)&&EDIT_NATIVE[id]){if(NATIVE)NATIVE.edit(EDIT_NATIVE[id]);else try{document.execCommand(EDIT_NATIVE[id])}catch(_){}return}if(modal)return;const f=CMDS[id];if(f)f()}
if(NATIVE)NATIVE.onMenu(cmd);
const K=s=>isMac?s.replace(/Ctrl\+Shift\+/,'\u21e7\u2318').replace(/Ctrl\+/,'\u2318').replace(/^Del$/,'\u232b'):s;
const MENU=[['File',[['New','new','Ctrl+N'],['Open...','open','Ctrl+O'],['Save','save','Ctrl+S'],['Save As',[['PNG (*.png)...','saveAs:png','Ctrl+Shift+S'],['24-bit Bitmap (*.bmp)...','saveAs:bmp'],['JPEG (*.jpg)...','saveAs:jpg']]],'-',['Print...','print','Ctrl+P'],'-',['Exit','exit']]],
 ['Edit',[['Undo','undo','Ctrl+Z',()=>undoS.length||txt||T.polygon.pts||T.curve.st],['Redo','redo','Ctrl+Y',()=>redoS.length],'-',['Cut','cut','Ctrl+X',()=>sel],['Copy','copy','Ctrl+C',()=>sel],['Paste','paste','Ctrl+V'],['Clear Selection','clearSel','Del',()=>sel],['Select All','selectAll','Ctrl+A']]],
 ['View',[['Tool Box','toggleToolbox','Ctrl+T',null,()=>S.toolbox],['Color Box','toggleColorbox','Ctrl+L',null,()=>S.colorbox],['Status Bar','toggleStatus','',null,()=>S.status],'-',['Zoom',[['Normal Size','zoomNormal','Ctrl+PgUp'],['Large Size','zoomLarge','Ctrl+PgDn'],['Custom...','zoomCustom'],'-',['Zoom In','zoomIn'],['Zoom Out','zoomOut']]],['Zoom In','zoomIn'],['Zoom Out','zoomOut'],'-',['Show Grid','toggleGrid','Ctrl+G',null,()=>S.grid],['Show Thumbnail','toggleThumb','',null,()=>S.thumb]]],
 ['Image',[['Flip/Rotate...','flipRotate','Ctrl+R'],['Stretch/Skew...','stretchSkew','Ctrl+W'],['Invert Colors','invert','Ctrl+I'],['Attributes...','attributes','Ctrl+E'],['Crop to Selection','crop','',()=>sel],['Clear Image','clearImage','Ctrl+Shift+N'],['Draw Opaque','toggleOpaque','',null,()=>!S.transparent]]],

function menuHTML(items){return items.map(it=>{if(it==='-')return'<div class="msep"></div>';const[l,id,k,en,ck]=it;if(Array.isArray(id))return`<div class="mi sub"><span>${l}</span><div class="mdrop">${menuHTML(id)}</div></div>`;const dis=en&&!en(),chk=ck&&ck();return`<div class="mi${dis?' dis':''}${chk?' chk':''}" data-cmd="${id}"><span>${l}</span><span class="k">${k?K(k):''}</span></div>`}).join('')}
const mb=$('menubar');

function openMenu(el){mb.querySelectorAll('.mtop').forEach(t=>{t.classList.toggle('open',t===el);if(t===el)t.querySelector('.mdrop').innerHTML=menuHTML(MENU[+t.dataset.m][1])})}

mb.addEventListener('mousedown',e=>e.preventDefault());

/* ---------- keyboard ---------- */
window.addEventListener('keydown',e=>{

 const c=map[k];if(c){e.preventDefault();cmd(c)}});

$('tools').innerHTML=TOOLS.map(([id,n])=>`<div class="tb" data-tool="${id}" title="${n}">${ICONS[id]}</div>`).join('');
$('tools').addEventListener('pointerdown',e=>{const b=e.target.closest('.tb');if(b){e.preventDefault();setTool(b.dataset.tool)}});

setDoc(null,DEF_W,DEF_H,'#ffffff');layoutOverlay();setTool('pencil');updTitle();

})();
